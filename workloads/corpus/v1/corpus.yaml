# Crosstalk workload corpus v1.
# Every family is one topic phrase. Each family is rendered through the same five
# paraphrase templates, so template wording carries no class signal by itself.
# Text must stay ASCII without quotes or backslashes so JSON request sizes depend only
# on byte length (checked by the builder).
version: 1.0.0
sensitive_class: medical
templates:
  t0: Can you explain {topic} in simple terms?
  t1: I would like a short overview of {topic}. What are the key points?
  t2: What are the most important things a beginner should understand about {topic}?
  t3: Give me a practical explanation of {topic}, including common mistakes to avoid.
  t4: Summarize what someone should know about {topic} before getting started.
determinism_template: t0
