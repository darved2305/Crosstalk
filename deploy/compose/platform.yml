services:
  postgres:
    image: postgres:16.10-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: crosstalk
      POSTGRES_USER: crosstalk
      POSTGRES_PASSWORD: ${CT_POSTGRES_PASSWORD:?set CT_POSTGRES_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [control]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U crosstalk -d crosstalk"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: [no-new-privileges:true]

  migrate:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    command: [alembic, upgrade, head]
    environment:
      CT_API_DATABASE_URL: postgresql+psycopg://crosstalk:${CT_POSTGRES_PASSWORD}@postgres:5432/crosstalk
    networks: [control]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    volumes:
      - ../../artifacts:/artifacts:ro
    environment:
      CT_API_DATABASE_URL: postgresql+psycopg://crosstalk:${CT_POSTGRES_PASSWORD}@postgres:5432/crosstalk
      CT_API_OPERATOR_TOKEN: ${CT_API_OPERATOR_TOKEN:?set CT_API_OPERATOR_TOKEN}
      CT_API_ORACLE_TOKEN: ${CT_API_ORACLE_TOKEN:?set CT_API_ORACLE_TOKEN}
      CT_API_CODE_COMMIT: ${CT_CODE_COMMIT:-unknown}
      CT_API_ARTIFACTS_ROOT: /artifacts
    ports: ["127.0.0.1:8080:8080"]
    networks: [control]
    depends_on:
      migrate: { condition: service_completed_successfully }

  # Claims plan/collect/reconstruct/validate/analyze/report jobs. The local-dev lab
  # (synthetic upstream + TLS shaper + recording relay) is non-reportable by
  # construction; the GPU laboratory uses CT_WORKER_LAB=external on the lab host.
  worker:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    command: [crosstalk-worker]
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    volumes:
      - ../../artifacts:/artifacts
    environment:
      CT_WORKER_DATABASE_URL: postgresql+psycopg://crosstalk:${CT_POSTGRES_PASSWORD}@postgres:5432/crosstalk
      CT_WORKER_ARTIFACTS_ROOT: /artifacts
      CT_WORKER_CODE_COMMIT: ${CT_CODE_COMMIT:-unknown}
      CT_WORKER_LAB: ${CT_WORKER_LAB:-local-dev}
      CT_WORKER_CORPUS_SOURCE: /app/workloads/corpus/v1/corpus.yaml
    healthcheck:
      disable: true
    networks: [control]
    depends_on:
      migrate: { condition: service_completed_successfully }

  console:
    build: ../../apps/console
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    environment:
      CT_CONSOLE_API_URL: http://api:8080
    ports: ["127.0.0.1:3000:3000"]
    networks: [control]
    depends_on:
      api: { condition: service_healthy }

networks:
  control:
    internal: true

volumes:
  postgres-data:
