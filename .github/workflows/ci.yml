name: ci
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans the pushed commit range, which needs the parent history.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run lint-imports
      - run: uv run pytest
      - run: docker compose -f deploy/compose/lab.yml --profile mock config --quiet
      - run: docker compose -f deploy/compose/lab.yml --profile gpu config --quiet
      - run: docker compose -f deploy/compose/lab.yml --profile mock --profile impaired config --quiet
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
