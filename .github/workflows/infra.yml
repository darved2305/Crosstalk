name: infrastructure

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Terraform operation
        required: true
        default: plan
        type: choice
        options: [plan, apply]

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.operation == 'apply' && 'production' || 'planning' }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_TERRAFORM_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.6
      - name: Initialize remote state
        run: terraform -chdir=infra/terraform init -input=false -backend-config="bucket=${{ vars.TERRAFORM_STATE_BUCKET }}" -backend-config="prefix=crosstalk/prod"
      - run: terraform -chdir=infra/terraform fmt -recursive -check
      - run: terraform -chdir=infra/terraform validate
      - name: Plan
        run: terraform -chdir=infra/terraform plan -input=false -out=tfplan
      - name: Apply reviewed plan
        if: inputs.operation == 'apply'
        run: terraform -chdir=infra/terraform apply -input=false -auto-approve tfplan
